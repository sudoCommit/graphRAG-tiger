[project]
name = "graphrag-tiger"
version = "0.1.0"
description = "A GraphRAG implementation"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Sidharth SN"}
]
keywords = ["graph", "rag", "retrieval", "augmented", "generation"]

dependencies = [
    "pyTigerGraph>=2.0.3",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.15.0",
    "openai>=2.34.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "tiktoken>=0.9.0",
    "streamlit>=1.45.0",
    "altair>=5.0.0",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]
