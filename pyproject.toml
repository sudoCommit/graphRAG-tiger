
[project]
name = "graphrag-tiger"
version = "0.1.0"
description = "A GraphRAG implementation"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Sidharth SN"}
]
keywords = ["graph", "rag", "retrieval", "augmented", "generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyTigerGraph>=2.0.3",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]


[project.urls]
Homepage = "https://github.com/yourusername/graphrag-tiger"